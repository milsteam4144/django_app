<!DOCTYPE html>
<html>
<head><title>Login</title></head>
<body>
  <h2>Log In</h2>
  <form method="POST"  action="{% url 'register' %}">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Log In</button>
  </form>
  <p>No account yet? <a href="/register">Register</a></p>
</body>
</html>
